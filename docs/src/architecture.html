<text x="40" y="74" font-size="15" fill="#6b7280">Team AMRIT_VIT · Digital Twin Challenge 2026 · synthetic patients only · decision support only</text>
<rect x="30" y="95" width="390" height="700" rx="14" fill="none" stroke="#2f6fb0" stroke-width="1.2" stroke-dasharray="2 4"/><text x="44" y="121" font-size="18" font-weight="700" fill="#2f6fb0">1  Synthetic data (data_gen/)</text>
<rect x="45" y="135" width="360" height="90" rx="10" fill="#eef4fb" stroke="#2f6fb0" stroke-width="1.6"/>
<text x="57" y="159" font-size="16" font-weight="700" fill="#1f2937">Cohort: the medical record</text>
<text x="57" y="181" font-size="13" fill="#1f2937">400 Indian T2D patients, Gaussian copula</text>
<text x="57" y="199" font-size="13" fill="#1f2937">labs, eGFR, liver, meds, allergies, diet</text>
<text x="57" y="217" font-size="13" fill="#1f2937">no genetic data</text>
<rect x="45" y="247" width="360" height="90" rx="10" fill="#eef4fb" stroke="#2f6fb0" stroke-width="1.6"/>
<text x="57" y="271" font-size="16" font-weight="700" fill="#1f2937">Hidden physiology</text>
<text x="57" y="293" font-size="13" fill="#1f2937">insulin sensitivity, beta cells, liver</text>
<text x="57" y="311" font-size="13" fill="#1f2937">from the record + unexplained variation</text>
<text x="57" y="329" font-size="13" fill="#1f2937">anchored to each patient's HbA1c</text>
<rect x="45" y="359" width="360" height="90" rx="10" fill="#eef4fb" stroke="#2f6fb0" stroke-width="1.6"/>
<text x="57" y="383" font-size="16" font-weight="700" fill="#1f2937">Behaviour (14 days)</text>
<text x="57" y="405" font-size="13" fill="#1f2937">47 Indian dishes, late dinners, eating out</text>
<text x="57" y="423" font-size="13" fill="#1f2937">walks, sleep stages, stress, illness</text>
<text x="57" y="441" font-size="13" fill="#1f2937">missed doses, partial meal log</text>
<rect x="45" y="471" width="360" height="72" rx="10" fill="#eef4fb" stroke="#2f6fb0" stroke-width="1.6"/>
<text x="57" y="495" font-size="16" font-weight="700" fill="#1f2937">Glucose-insulin ODE</text>
<text x="57" y="517" font-size="13" fill="#1f2937">Bergman / Dalla Man hybrid, 1-min steps</text>
<text x="57" y="535" font-size="13" fill="#1f2937">meals, 5 drug classes, exercise</text>
<rect x="45" y="565" width="360" height="72" rx="10" fill="#eef4fb" stroke="#2f6fb0" stroke-width="1.6"/>
<text x="57" y="589" font-size="16" font-weight="700" fill="#1f2937">Sensor realism</text>
<text x="57" y="611" font-size="13" fill="#1f2937">CGM lag, drift, noise, gaps (MARD 7 %)</text>
<text x="57" y="629" font-size="13" fill="#1f2937">wearable gaps, phantom steps, stage errors</text>

<text x="57" y="746" font-size="13" fill="#1f2937">Shanghai T2DM (CC BY 4.0), CGMacros (CC BY-NC-SA)</text>
<text x="57" y="764" font-size="13" fill="#1f2937">tune 7 settings on half, test on the rest</text>

<text x="482" y="724" font-size="15" font-weight="700" fill="#1f2937">validation/</text>
<text x="482" y="746" font-size="13" fill="#1f2937">level-matched dynamics, TSTR,</text>
<text x="482" y="764" font-size="13" fill="#1f2937">real-vs-synthetic discriminator</text>
<rect x="450" y="95" width="290" height="590" rx="14" fill="none" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="2 4"/><text x="464" y="121" font-size="18" font-weight="700" fill="#6b7280">Data stores</text>

<text x="477" y="174" font-size="16" font-weight="700" fill="#1f2937">observed/  (clinic view)</text>
<text x="477" y="196" font-size="13" fill="#1f2937">EHR record + HbA1c history</text>
<text x="477" y="214" font-size="13" fill="#1f2937">prescriptions + reported adherence</text>
<text x="477" y="232" font-size="13" fill="#1f2937">CGM every 5 min</text>
<text x="477" y="250" font-size="13" fill="#1f2937">heart rate, steps</text>
<text x="477" y="268" font-size="13" fill="#1f2937">sleep stages, overnight HRV</text>
<text x="477" y="286" font-size="13" fill="#1f2937">patient's meal log</text>
<text x="477" y="304" font-size="13" fill="#1f2937">split by patient 70/15/15</text>
<rect x="465" y="400" width="260" height="140" rx="10" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.6"/>
<text x="477" y="424" font-size="16" font-weight="700" fill="#1f2937">truth/  (hidden)</text>
<text x="477" y="446" font-size="13" fill="#1f2937">true meals, doses taken</text>
<text x="477" y="464" font-size="13" fill="#1f2937">true physiology parameters</text>
<text x="477" y="482" font-size="13" fill="#1f2937">plasma glucose</text>
<text x="477" y="500" font-size="13" fill="#1f2937">used only to score models,</text>
<text x="477" y="518" font-size="13" fill="#1f2937">explanations and the twin</text>

<rect x="770" y="95" width="400" height="330" rx="14" fill="none" stroke="#1e8449" stroke-width="1.2" stroke-dasharray="2 4"/><text x="784" y="121" font-size="18" font-weight="700" fill="#1e8449">2  Prediction (models/)</text>
<rect x="785" y="135" width="370" height="72" rx="10" fill="#eef7f0" stroke="#1e8449" stroke-width="1.6"/>
<text x="797" y="159" font-size="16" font-weight="700" fill="#1f2937">Feature builder (past data only)</text>
<text x="797" y="181" font-size="13" fill="#1f2937">CGM history, wearables, meal log, record</text>
<text x="797" y="199" font-size="13" fill="#1f2937">a test proves no future data leaks in</text>
<rect x="785" y="225" width="370" height="90" rx="10" fill="#eef7f0" stroke="#1e8449" stroke-width="1.6"/>
<text x="797" y="249" font-size="16" font-weight="700" fill="#1f2937">LightGBM fusion</text>
<text x="797" y="271" font-size="13" fill="#1f2937">glucose 15-120 min + 80 % band (conformal)</text>
<text x="797" y="289" font-size="13" fill="#1f2937">2-hour peak; calibrated spike probability</text>
<text x="797" y="307" font-size="13" fill="#1f2937">ablation: CGM > + wearables > + EHR > + meal log</text>
<rect x="785" y="333" width="370" height="76" rx="10" fill="#eef7f0" stroke="#1e8449" stroke-width="1.6"/>
<text x="797" y="357" font-size="16" font-weight="700" fill="#1f2937">Explanations (grouped SHAP)</text>
<text x="797" y="379" font-size="13" fill="#1f2937">clinical sentences in mg/dL vs similar patients</text>
<text x="797" y="397" font-size="13" fill="#1f2937">checked against the hidden truth</text>

<text x="797" y="509" font-size="16" font-weight="700" fill="#1f2937">Personalise the ODE</text>
<text x="797" y="531" font-size="13" fill="#1f2937">record-based prior + fit to 7 days of CGM</text>
<text x="797" y="549" font-size="13" fill="#1f2937">twin card: sensitivity, secretion, meal response</text>
<rect x="785" y="575" width="370" height="58" rx="10" fill="#fdf3e7" stroke="#c77c0e" stroke-width="1.6"/>
<text x="797" y="599" font-size="16" font-weight="700" fill="#1f2937">Constraint checks (before)</text>
<text x="797" y="621" font-size="13" fill="#1f2937">diet, allergies, intolerances, eGFR drug limits</text>
<rect x="785" y="645" width="370" height="72" rx="10" fill="#fdf3e7" stroke="#c77c0e" stroke-width="1.6"/>
<text x="797" y="669" font-size="16" font-weight="700" fill="#1f2937">What-if simulator</text>
<text x="797" y="691" font-size="13" fill="#1f2937">swap / resize / skip a meal, walk, dose change</text>
<text x="797" y="709" font-size="13" fill="#1f2937">next 5 h, or a typical day at steady state</text>

<text x="1227" y="335" font-size="13" fill="#1f2937">why panel, record, twin card</text>
